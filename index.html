<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>
  <style>
    :root {
      --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --muted: #64748b;
      --primary: #4f46e5; --primary-dark: #4338ca; --border: #e2e8f0;
      --danger-bg: #fef2f2; --danger-text: #b91c1c; --danger-border: #fecaca;
      --success-bg: #f0fdf4; --success-text: #15803d; --success-border: #bbf7d0;
      --badge-alta: #fee2e2; --badge-alta-text: #991b1b;
      --badge-media: #fef3c7; --badge-media-text: #92400e;
      --badge-baixa: #e0f2fe; --badge-baixa-text: #075985;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: 24px 16px; display: flex; justify-content: center;
    }
    .container { width: 100%; max-width: 900px; margin: 0 auto; }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 16px; padding: 24px; box-shadow: 0 10px 25px rgba(15, 23, 42, .06);
      margin-bottom: 24px;
    }
    .auth-card { max-width: 420px; margin: 60px auto 0; }
    .header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border);
    }
    h1 { margin: 0; font-size: 1.6rem; color: #1e1b4b; }
    h2 { margin: 0 0 16px; font-size: 1.25rem; }
    .subtitle { margin: 4px 0 20px; color: var(--muted); font-size: .95rem; }
    .user-info { display: flex; align-items: center; gap: 12px; }
    .user-name { font-weight: 600; color: var(--text); font-size: 0.95rem; }

    .form-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
    }
    .form-group-full { grid-column: span 2; }
    @media (max-width: 640px) {
      .form-grid { grid-template-columns: 1fr; }
      .form-group-full { grid-column: span 1; }
    }

    label { display: block; margin-bottom: 6px; font-size: .85rem; font-weight: 600; color: #334155; }
    .required { color: var(--danger-text); margin-left: 2px; }
    input, textarea, select {
      width: 100%; padding: 10px 12px; font-size: .95rem;
      border: 1px solid var(--border); border-radius: 8px; outline: none;
      background: #fff; font-family: inherit; transition: border-color .15s;
    }
    textarea { resize: vertical; min-height: 80px; }
    input:focus, textarea:focus, select:focus {
      border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, .15);
    }
    .input-error { border-color: var(--danger-text) !important; background: #fffdfd; }
    .field-hint { font-size: 0.75rem; color: var(--muted); margin-top: 4px; }

    .button-group { display: flex; gap: 12px; margin-top: 20px; }
    button {
      padding: 9px 16px; font-size: .9rem; font-weight: 600; color: #fff;
      background: var(--primary); border: 0; border-radius: 8px; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      transition: background .15s;
    }
    button:hover { background: var(--primary-dark); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    button.secondary {
      background: transparent; color: var(--muted); border: 1px solid var(--border);
    }
    button.secondary:hover { background: #f1f5f9; color: var(--text); }
    button.danger { background: #dc2626; color: #fff; }
    button.danger:hover { background: #b91c1c; }
    button.small { padding: 5px 10px; font-size: .8rem; border-radius: 6px; }

    .alert {
      padding: 12px 16px; border-radius: 8px; margin-bottom: 18px; font-size: .9rem;
    }
    .alert-danger {
      background: var(--danger-bg); color: var(--danger-text); border: 1px solid var(--danger-border);
    }
    .alert-success {
      background: var(--success-bg); color: var(--success-text); border: 1px solid var(--success-border);
    }
    .alert ul { margin: 6px 0 0; padding-left: 20px; }

    .badge {
      display: inline-block; padding: 3px 8px; border-radius: 9999px; font-size: 0.75rem;
      font-weight: 600; text-transform: uppercase;
    }
    .badge-alta { background: var(--badge-alta); color: var(--badge-alta-text); }
    .badge-media { background: var(--badge-media); color: var(--badge-media-text); }
    .badge-baixa { background: var(--badge-baixa); color: var(--badge-baixa-text); }
    .badge-cat { background: #f1f5f9; color: #475569; }

    /* Estilos da Tabela da Issue #3 */
    .table-container { width: 100%; overflow-x: auto; margin-top: 12px; }
    table {
      width: 100%; border-collapse: collapse; text-align: left; font-size: .9rem;
    }
    th {
      background: #f8fafc; padding: 12px 10px; font-weight: 600; color: #475569;
      border-bottom: 2px solid var(--border); user-select: none;
    }
    th.sortable { cursor: pointer; transition: background .15s; }
    th.sortable:hover { background: #f1f5f9; color: var(--primary); }
    td {
      padding: 12px 10px; border-bottom: 1px solid var(--border); vertical-align: middle;
    }
    tr:hover td { background: #fafafa; }
    tr.selected td { background: #f5f3ff; }

    .selection-bar {
      display: flex; justify-content: space-between; align-items: center;
      background: #eef2ff; border: 1px solid #c7d2fe; padding: 10px 16px;
      border-radius: 8px; margin-bottom: 12px; font-size: .9rem; color: #3730a3;
    }
    .pagination-bar {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border);
      font-size: .85rem; color: var(--muted);
    }
    .empty-state {
      text-align: center; padding: 36px 20px; color: var(--muted);
      border: 1px dashed var(--border); border-radius: 12px;
    }
    .table-title { font-weight: 600; color: #0f172a; }
    .table-desc { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function readToken() {
      try { return sessionStorage.getItem('token'); } catch (e) { return null; }
    }
    function writeToken(value) {
      try {
        if (value) sessionStorage.setItem('token', value);
        else sessionStorage.removeItem('token');
      } catch (e) { /* ignora */ }
    }

    function LoginForm({ onLogin }) {
      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);

      async function handleSubmit(event) {
        event.preventDefault();
        setError('');
        setLoading(true);
        try {
          const res = await fetch('/api/web/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password }),
          });
          if (res.status === 401) {
            setError('Usuário ou senha inválidos.');
          } else if (!res.ok) {
            setError('Não foi possível entrar. Tente novamente.');
          } else {
            const data = await res.json();
            onLogin(data.token);
          }
        } catch (e) {
          setError('Não foi possível conectar ao servidor.');
        } finally {
          setLoading(false);
        }
      }

      return (
        <div className="card auth-card">
          <form onSubmit={handleSubmit}>
            <h1>To-Do List</h1>
            <p className="subtitle">Entre para gerenciar suas tarefas</p>
            {error && <div className="alert alert-danger" role="alert">{error}</div>}
            <div style={{ marginBottom: 14 }}>
              <label>Usuário <span className="required">*</span></label>
              <input
                type="text" value={username} autoComplete="username" required
                placeholder="Ex: admin"
                onChange={(e) => setUsername(e.target.value)}
              />
            </div>
            <div style={{ marginBottom: 20 }}>
              <label>Senha <span className="required">*</span></label>
              <input
                type="password" value={password} autoComplete="current-password" required
                placeholder="••••••••"
                onChange={(e) => setPassword(e.target.value)}
              />
            </div>
            <button type="submit" disabled={loading} style={{ width: '100%' }}>
              {loading ? 'Entrando...' : 'Entrar no Sistema'}
            </button>
          </form>
        </div>
      );
    }

    function RecordForm({ editingRecord, onSaved, onCancel, token }) {
      const [title, setTitle] = useState('');
      const [description, setDescription] = useState('');
      const [category, setCategory] = useState('Trabalho');
      const [priority, setPriority] = useState('media');
      const [dueDate, setDueDate] = useState('');
      const [errors, setErrors] = useState([]);
      const [loading, setLoading] = useState(false);
      const [successMsg, setSuccessMsg] = useState('');

      useEffect(() => {
        if (editingRecord) {
          setTitle(editingRecord.title || '');
          setDescription(editingRecord.description || '');
          setCategory(editingRecord.category || 'Trabalho');
          setPriority(editingRecord.priority || 'media');
          setDueDate(editingRecord.due_date ? editingRecord.due_date.slice(0, 10) : '');
          setErrors([]);
          setSuccessMsg('');
        } else {
          resetForm();
        }
      }, [editingRecord]);

      function resetForm() {
        setTitle('');
        setDescription('');
        setCategory('Trabalho');
        setPriority('media');
        setDueDate('');
        setErrors([]);
      }

      function validateClient() {
        const clientErrors = [];
        if (!title.trim() || title.trim().length < 3 || title.trim().length > 100) {
          clientErrors.push('Título deve ter entre 3 e 100 caracteres');
        }
        if (!description.trim() || description.trim().length < 3 || description.trim().length > 500) {
          clientErrors.push('Descrição deve ter entre 3 e 500 caracteres');
        }
        if (!category.trim() || category.trim().length < 2 || category.trim().length > 50) {
          clientErrors.push('Categoria deve ter entre 2 e 50 caracteres');
        }
        if (!['baixa', 'media', 'alta'].includes(priority)) {
          clientErrors.push('Selecione uma prioridade válida (baixa, média ou alta)');
        }
        if (dueDate && !/^\d{4}-\d{2}-\d{2}$/.test(dueDate)) {
          clientErrors.push('Data de vencimento deve estar no formato AAAA-MM-DD');
        }
        return clientErrors;
      }

      async function handleSubmit(e) {
        e.preventDefault();
        setSuccessMsg('');
        const clientErrors = validateClient();
        if (clientErrors.length > 0) {
          setErrors(clientErrors);
          return;
        }

        setLoading(true);
        setErrors([]);

        const payload = {
          title: title.trim(),
          description: description.trim(),
          category: category.trim(),
          priority,
          due_date: dueDate ? dueDate : null,
        };

        const isEditing = Boolean(editingRecord && editingRecord.id);
        const url = isEditing ? `/api/web/records/${editingRecord.id}` : '/api/web/records';
        const method = isEditing ? 'PUT' : 'POST';

        try {
          const res = await fetch(url, {
            method,
            headers: {
              'Content-Type': 'application/json',
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify(payload),
          });

          const data = await res.json();
          if (!res.ok) {
            if (data.errors && Array.isArray(data.errors)) {
              setErrors(data.errors);
            } else {
              setErrors([data.message || 'Erro ao processar formulário']);
            }
          } else {
            setSuccessMsg(isEditing ? 'Tarefa atualizada com sucesso!' : 'Tarefa criada com sucesso!');
            if (!isEditing) resetForm();
            onSaved(data);
          }
        } catch (err) {
          setErrors(['Não foi possível conectar à API. Verifique sua conexão.']);
        } finally {
          setLoading(false);
        }
      }

      return (
        <div className="card" id="form-section">
          <h2>{editingRecord ? `Editar Tarefa #${editingRecord.id}` : 'Nova Tarefa'}</h2>
          <p className="subtitle">Preencha os campos obrigatórios (*) para salvar os dados.</p>

          {successMsg && <div className="alert alert-success">{successMsg}</div>}
          {errors.length > 0 && (
            <div className="alert alert-danger" role="alert">
              <strong>Corrija os erros abaixo:</strong>
              <ul>
                {errors.map((err, i) => <li key={i}>{err}</li>)}
              </ul>
            </div>
          )}

          <form onSubmit={handleSubmit}>
            <div className="form-grid">
              <div className="form-group-full">
                <label>Título da Tarefa <span className="required">*</span></label>
                <input
                  type="text"
                  placeholder="Ex: Implementar autenticação e testes"
                  value={title}
                  onChange={(e) => setTitle(e.target.value)}
                  className={errors.some(e => e.includes('Título')) ? 'input-error' : ''}
                />
                <div className="field-hint">Mínimo 3 e máximo 100 caracteres.</div>
              </div>

              <div className="form-group-full">
                <label>Descrição Detalhada <span className="required">*</span></label>
                <textarea
                  placeholder="Ex: Detalhes do escopo e requisitos de entrega..."
                  value={description}
                  onChange={(e) => setDescription(e.target.value)}
                  className={errors.some(e => e.includes('Descrição')) ? 'input-error' : ''}
                />
                <div className="field-hint">Mínimo 3 e máximo 500 caracteres.</div>
              </div>

              <div>
                <label>Categoria <span className="required">*</span></label>
                <select
                  value={category}
                  onChange={(e) => setCategory(e.target.value)}
                  className={errors.some(e => e.includes('Categoria')) ? 'input-error' : ''}
                >
                  <option value="Trabalho">Trabalho</option>
                  <option value="Estudo">Estudo</option>
                  <option value="Pessoal">Pessoal</option>
                  <option value="Projetos">Projetos</option>
                  <option value="Geral">Geral</option>
                </select>
              </div>

              <div>
                <label>Prioridade <span className="required">*</span></label>
                <select
                  value={priority}
                  onChange={(e) => setPriority(e.target.value)}
                  className={errors.some(e => e.includes('Prioridade')) ? 'input-error' : ''}
                >
                  <option value="baixa">Baixa</option>
                  <option value="media">Média</option>
                  <option value="alta">Alta</option>
                </select>
              </div>

              <div className="form-group-full">
                <label>Data de Vencimento (Prazo)</label>
                <input
                  type="date"
                  value={dueDate}
                  onChange={(e) => setDueDate(e.target.value)}
                  className={errors.some(e => e.includes('vencimento')) ? 'input-error' : ''}
                />
                <div className="field-hint">Opcional. Formato AAAA-MM-DD.</div>
              </div>
            </div>

            <div className="button-group">
              <button type="submit" disabled={loading}>
                {loading ? 'Salvando...' : editingRecord ? 'Salvar Alterações' : 'Cadastrar Tarefa'}
              </button>
              {editingRecord && (
                <button type="button" className="secondary" onClick={onCancel}>
                  Cancelar Edição
                </button>
              )}
            </div>
          </form>
        </div>
      );
    }

    /** Issue #3: Tabela de Tarefas com 4 campos visíveis, 5 itens por página, ordenação, seleção e exclusão */
    function RecordsTable({
      records,
      total,
      page,
      limit,
      totalPages,
      sort,
      order,
      onPageChange,
      onSortChange,
      onEdit,
      onDelete,
      onDeleteMultiple,
      loading
    }) {
      const [selectedIds, setSelectedIds] = useState([]);

      // Limpa a seleção ao trocar de página
      useEffect(() => {
        setSelectedIds([]);
      }, [page]);

      function toggleSelect(id) {
        setSelectedIds(prev =>
          prev.includes(id) ? prev.filter(item => item !== id) : [...prev, id]
        );
      }

      function toggleSelectAll() {
        if (selectedIds.length === records.length) {
          setSelectedIds([]);
        } else {
          setSelectedIds(records.map(r => r.id));
        }
      }

      function renderSortArrow(field) {
        if (sort !== field) return <span style={{ opacity: 0.3 }}> ↕</span>;
        return order === 'asc' ? ' ▲' : ' ▼';
      }

      return (
        <div className="card">
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 12 }}>
            <div>
              <h2>Tarefas Cadastradas ({total})</h2>
              <div className="subtitle" style={{ margin: 0 }}>
                Tabela paginada (5 itens/pág), ordenação por coluna e seleção múltipla.
              </div>
            </div>
          </div>

          {selectedIds.length > 0 && (
            <div className="selection-bar">
              <span><strong>{selectedIds.length}</strong> tarefa(s) selecionada(s)</span>
              <button
                type="button"
                className="danger small"
                onClick={() => {
                  if (confirm(`Tem certeza que deseja excluir ${selectedIds.length} tarefa(s) selecionada(s)?`)) {
                    onDeleteMultiple(selectedIds);
                    setSelectedIds([]);
                  }
                }}
              >
                🗑️ Excluir Selecionadas
              </button>
            </div>
          )}

          {records.length === 0 ? (
            <div className="empty-state">
              Nenhuma tarefa cadastrada no banco de dados. Utilize o formulário acima para adicionar!
            </div>
          ) : (
            <div className="table-container">
              <table>
                <thead>
                  <tr>
                    <th style={{ width: 40, textAlign: 'center' }}>
                      <input
                        type="checkbox"
                        checked={records.length > 0 && selectedIds.length === records.length}
                        onChange={toggleSelectAll}
                        title="Selecionar todos da página"
                      />
                    </th>
                    <th className="sortable" onClick={() => onSortChange('title')}>
                      1. Título {renderSortArrow('title')}
                    </th>
                    <th className="sortable" onClick={() => onSortChange('category')}>
                      2. Categoria {renderSortArrow('category')}
                    </th>
                    <th className="sortable" onClick={() => onSortChange('priority')}>
                      3. Prioridade {renderSortArrow('priority')}
                    </th>
                    <th className="sortable" onClick={() => onSortChange('due_date')}>
                      4. Prazo {renderSortArrow('due_date')}
                    </th>
                    <th style={{ textAlign: 'right' }}>Ações</th>
                  </tr>
                </thead>
                <tbody>
                  {records.map(rec => {
                    const isSelected = selectedIds.includes(rec.id);
                    return (
                      <tr key={rec.id} className={isSelected ? 'selected' : ''}>
                        <td style={{ textAlign: 'center' }}>
                          <input
                            type="checkbox"
                            checked={isSelected}
                            onChange={() => toggleSelect(rec.id)}
                          />
                        </td>
                        <td>
                          <div className="table-title">#{rec.id} — {rec.title}</div>
                          <div className="table-desc">{rec.description}</div>
                        </td>
                        <td>
                          <span className="badge badge-cat">{rec.category}</span>
                        </td>
                        <td>
                          <span className={`badge badge-${rec.priority}`}>
                            {rec.priority === 'alta' ? 'Alta' : rec.priority === 'media' ? 'Média' : 'Baixa'}
                          </span>
                        </td>
                        <td>
                          {rec.due_date ? <span>📅 {rec.due_date}</span> : <span style={{ color: '#94a3b8' }}>Sem prazo</span>}
                        </td>
                        <td style={{ textAlign: 'right', whiteSpace: 'nowrap' }}>
                          <button
                            type="button"
                            className="secondary small"
                            style={{ marginRight: 6 }}
                            onClick={() => {
                              onEdit(rec);
                              document.getElementById('form-section')?.scrollIntoView({ behavior: 'smooth' });
                            }}
                            title="Editar registro"
                          >
                            ✏️ Editar
                          </button>
                          <button
                            type="button"
                            className="danger small"
                            onClick={() => {
                              if (confirm(`Deseja realmente excluir a tarefa "${rec.title}"?`)) {
                                onDelete(rec.id);
                              }
                            }}
                            title="Excluir registro"
                          >
                            🗑️ Excluir
                          </button>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          )}

          {/* Paginação de 5 em 5 itens */}
          <div className="pagination-bar">
            <div>
              Mostrando página <strong>{page}</strong> de <strong>{totalPages}</strong> (Total: {total} tarefas)
            </div>
            <div style={{ display: 'flex', gap: 8 }}>
              <button
                type="button"
                className="secondary small"
                disabled={page <= 1 || loading}
                onClick={() => onPageChange(page - 1)}
              >
                ◀ Anterior
              </button>
              <button
                type="button"
                className="secondary small"
                disabled={page >= totalPages || loading}
                onClick={() => onPageChange(page + 1)}
              >
                Próxima ▶
              </button>
            </div>
          </div>
        </div>
      );
    }

    function MainApp({ username, token, onLogout }) {
      const [records, setRecords] = useState([]);
      const [total, setTotal] = useState(0);
      const [page, setPage] = useState(1);
      const [limit] = useState(5);
      const [totalPages, setTotalPages] = useState(1);
      const [sort, setSort] = useState('id');
      const [order, setOrder] = useState('desc');
      const [loading, setLoading] = useState(false);
      const [editingRecord, setEditingRecord] = useState(null);
      const [feedback, setFeedback] = useState('');

      // Dados carregados do banco SQLite ao abrir a página
      async function fetchRecords(p = page, s = sort, o = order) {
        setLoading(true);
        try {
          const res = await fetch(`/api/web/records?page=${p}&limit=${limit}&sort=${s}&order=${o}`, {
            headers: { Authorization: `Bearer ${token}` }
          });
          if (res.ok) {
            const data = await res.json();
            setRecords(data.items || []);
            setTotal(data.total || 0);
            setPage(data.page || 1);
            setTotalPages(data.totalPages || 1);
          }
        } catch (e) {
          console.error('Falha ao carregar registros do banco', e);
        } finally {
          setLoading(false);
        }
      }

      useEffect(() => {
        fetchRecords(page, sort, order);
      }, [page, sort, order]);

      function handleSortChange(field) {
        if (sort === field) {
          setOrder(prev => (prev === 'asc' ? 'desc' : 'asc'));
        } else {
          setSort(field);
          setOrder('asc');
        }
        setPage(1);
      }

      async function handleDelete(id) {
        try {
          const res = await fetch(`/api/web/records/${id}`, {
            method: 'DELETE',
            headers: { Authorization: `Bearer ${token}` }
          });
          if (res.ok) {
            setFeedback(`Tarefa #${id} excluída com sucesso!`);
            fetchRecords();
          } else {
            alert('Não foi possível excluir a tarefa.');
          }
        } catch (e) {
          alert('Erro de conexão ao excluir tarefa.');
        }
      }

      async function handleDeleteMultiple(ids) {
        for (const id of ids) {
          await fetch(`/api/web/records/${id}`, {
            method: 'DELETE',
            headers: { Authorization: `Bearer ${token}` }
          });
        }
        setFeedback(`${ids.length} tarefa(s) excluída(s) com sucesso!`);
        fetchRecords();
      }

      function handleSaved() {
        setEditingRecord(null);
        fetchRecords();
      }

      return (
        <div className="container">
          <div className="header">
            <div>
              <h1>To-Do List</h1>
              <span className="subtitle">Gestão de Tarefas Web + CLI</span>
            </div>
            <div className="user-info">
              <span className="user-name">👤 {username}</span>
              <button className="secondary small" onClick={onLogout}>Sair</button>
            </div>
          </div>

          {feedback && (
            <div className="alert alert-success" style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
              <span>{feedback}</span>
              <button type="button" className="secondary small" onClick={() => setFeedback('')}>✕</button>
            </div>
          )}

          <RecordForm
            editingRecord={editingRecord}
            onSaved={handleSaved}
            onCancel={() => setEditingRecord(null)}
            token={token}
          />

          <RecordsTable
            records={records}
            total={total}
            page={page}
            limit={limit}
            totalPages={totalPages}
            sort={sort}
            order={order}
            onPageChange={(newPage) => setPage(newPage)}
            onSortChange={handleSortChange}
            onEdit={(rec) => setEditingRecord(rec)}
            onDelete={handleDelete}
            onDeleteMultiple={handleDeleteMultiple}
            loading={loading}
          />
        </div>
      );
    }

    function App() {
      const [token, setToken] = useState(readToken());
      const [username, setUsername] = useState(null);

      function logout() {
        writeToken(null);
        setToken(null);
        setUsername(null);
      }

      function login(newToken) {
        writeToken(newToken);
        setToken(newToken);
      }

      useEffect(() => {
        if (!token) return;
        fetch('/api/web/me', { headers: { Authorization: 'Bearer ' + token } })
          .then((res) => (res.ok ? res.json() : Promise.reject()))
          .then((data) => setUsername(data.username))
          .catch(logout);
      }, [token]);

      if (token && username) {
        return <MainApp username={username} token={token} onLogout={logout} />;
      }

      if (token) {
        return (
          <div className="card auth-card" style={{ textAlign: 'center' }}>
            <p className="subtitle">Carregando sessão...</p>
          </div>
        );
      }

      return <LoginForm onLogin={login} />;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
