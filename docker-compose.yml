services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      DB_PATH: /app/data/app.db
      APP_USER: ${APP_USER:-admin}
      APP_PASSWORD: ${APP_PASSWORD:-admin123}
      TOKEN_SECRET: ${TOKEN_SECRET:-troque-este-segredo-em-producao}
    volumes:
      - db-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/web/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

  # CLI (issue #7): docker compose run --rm cli <comando>   (ex.: health, token, whoami, help)
  # Sobe a API automaticamente. A CLI só fala com a API pela rede do Compose; não monta o volume do banco.
  cli:
    build: .
    profiles: ["cli"]
    depends_on:
      app:
        condition: service_healthy
    entrypoint: ["node", "-e", "require('./dist/cli.js').run(process.argv.slice(1)).then((code) => process.exit(code))"]
    environment:
      API_URL: http://app:3000
      CLI_USER: ${APP_USER:-admin}
      CLI_PASSWORD: ${APP_PASSWORD:-admin123}
      TODO_TOKEN: ${TODO_TOKEN:-}
    volumes:
      - ./exports:/app/exports
  # Testes unitários + cobertura: docker compose run --rm test
  test:
    build: .
    profiles: ["test"]
    command: ["npx", "jest", "--coverage"]

volumes:
  db-data:
